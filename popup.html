<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      min-height: 200px;
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    
    .search-input {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    .search-input:focus {
      outline: none;
      border-color: #4285f4;
    }
    
    .results-container {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 15px;
    }
    
    .tab-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tab-item:hover {
      background-color: #f8f9fa;
    }
    
    .tab-item:last-child {
      border-bottom: none;
    }
    
    .tab-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    
    .tab-content {
      flex: 1;
      min-width: 0;
    }
    
    .tab-title {
      font-weight: 500;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .tab-url {
      color: #666;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .no-results {
      padding: 20px;
      text-align: center;
      color: #666;
    }
    
    .loading {
      padding: 20px;
      text-align: center;
      color: #666;
    }
    
    .footer-links {
      border-top: 1px solid #f0f0f0;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    
    .footer-link {
      color: #4285f4;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 3px;
      transition: background-color 0.2s;
    }
    
    .footer-link:hover {
      background-color: #f8f9fa;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <input type="text" class="search-input" placeholder="Поиск по вкладкам..." autofocus>
  <div class="results-container" id="results"></div>
  
  <div class="footer-links">
    <a href="http://wwwtools.ru" target="_blank" class="footer-link">Web инструменты</a>
    <a href="https://def-expert.ru" target="_blank" class="footer-link">Web безопасность</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
